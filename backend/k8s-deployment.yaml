apiVersion: apps/v1
kind: Deployment
metadata:
  name: symbioai-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: symbioai-backend
  template:
    metadata:
      labels:
        app: symbioai-backend
    spec:
      containers:
      - name: backend
        image: ghcr.io/ANIKJAIN4470/symbio.ai/symbioai-backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: symbioai-secrets
              key: mongodb-uri
        - name: DATABASE_NAME
          value: "symbioai"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: symbioai-secrets
              key: secret-key
        - name: CORS_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: symbioai-config
              key: cors-origins
        - name: ENVIRONMENT
          value: "production"
        - name: FACTORY_VERIFICATION_CODE
          valueFrom:
            secretKeyRef:
              name: symbioai-secrets
              key: factory-verification-code
        - name: GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: symbioai-secrets
              key: google-client-id
        - name: GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: symbioai-secrets
              key: google-client-secret
        - name: RESEND_API_KEY
          valueFrom:
            secretKeyRef:
              name: symbioai-secrets
              key: resend-api-key
        - name: FRONTEND_URL
          valueFrom:
            configMapKeyRef:
              name: symbioai-config
              key: frontend-url
---
apiVersion: v1
kind: Service
metadata:
  name: symbioai-backend-service
spec:
  selector:
    app: symbioai-backend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
  type: LoadBalancer
