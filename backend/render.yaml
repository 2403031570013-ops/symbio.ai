services:
  - type: web
    name: symbio-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATABASE_URL
        sync: false
        # Required: mongodb+srv://ANIKJAIN4470_DB_USER:Anikjain4470@cluster0.ullffax.mongodb.net/symbioai?retryWrites=true&w=majority&appName=Cluster0
      - key: DATABASE_NAME
        value: symbioai
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
        # Your Vercel frontend URL(s) - comma separated (e.g., https://your-project.vercel.app)
      - key: ENVIRONMENT
        value: development
      - key: SECURE_COOKIES
        value: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        value: ""
        # Leave empty to use SMTP, or set Resend API key for Resend service
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        value: noreply@symbioai.com
      - key: SMTP_FROM_EMAIL
        value: no-reply@symbioai.com
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: us-east-1
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: CLOUD_STORAGE_KEYS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: FACTORY_VERIFICATION_CODE
        value: "SYMBIO2024"
      - key: DEV_EMAIL_OTP
        value: "654321"
      - key: DEV_MOBILE_OTP
        value: "123456"
      - key: DEV_FACTORY_CODE
        value: "123456"
      - key: FRONTEND_URL
        sync: false
        # Your Vercel frontend URL (e.g., https://your-project.vercel.app)
